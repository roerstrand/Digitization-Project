<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 48" role="img" aria-label="Baltic Exhibition 1914">
  <g fill="#c9a84c">
    <!-- Spire ball -->
    <circle cx="18" cy="2" r="1.6"/>
    <!-- Spire -->
    <polygon points="18,3.6 15,10 21,10"/>
    <!-- Tower body -->
    <rect x="14.5" y="10" width="7" height="16"/>
    <!-- Tower arch window (negative/transparent) -->
    <path d="M16.5 14 L16.5 20 A1.5 1.5 0 0 0 19.5 20 L19.5 14 Z" fill="none"/>
    <!-- Lintel -->
    <rect x="7" y="25.5" width="22" height="2.5"/>
    <!-- Capital detail left -->
    <rect x="7" y="24" width="6" height="1.5" rx="0.4"/>
    <!-- Capital detail right -->
    <rect x="23" y="24" width="6" height="1.5" rx="0.4"/>
    <!-- Left column -->
    <rect x="7" y="28" width="5.5" height="14"/>
    <!-- Right column -->
    <rect x="23.5" y="28" width="5.5" height="14"/>
    <!-- Steps -->
    <rect x="5"  y="42" width="26" height="2"/>
    <rect x="2"  y="44" width="32" height="2"/>
    <rect x="0"  y="46" width="36" height="2"/>
  </g>
  <!-- Portal arch (stroke) -->
  <path d="M7 31 Q18 19.5 29 31" fill="none" stroke="#c9a84c" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Tower arch window (stroke for visibility) -->
  <path d="M16.5 20 L16.5 14 A1.5 1.5 0 0 1 19.5 14 L19.5 20" fill="none" stroke="#1a1612" stroke-width="0.8"/>
</svg>
